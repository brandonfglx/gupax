name: Release Artifacts

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "full"

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo
          target
        key: ${{ matrix.os }}

    - name: Install dependencies
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt update
          sudo apt install -y libgtk-3-dev mingw-w64
          rustup target install x86_64-pc-windows-gnu
        elif [ "$RUNNER_OS" == "macOS" ]; then
          cargo install cargo-bundle
          rustup target install aarch64-apple-darwin
          rustup target install x86_64-apple-darwin
        fi
      shell: bash


    - name: Build
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          cargo bundle --release --target x86_64-apple-darwin
          cargo bundle --release --target aarch64-apple-darwin
          mv target/x86_64-apple-darwin/release/bundle/osx/Gupax.app Gupax-macos-x64.app
          mv target/aarch64-apple-darwin/release/bundle/osx/Gupax.app Gupax-macos-arm64.app
          tar -cf macos.tar Gupax-macos-arm64.app Gupax-macos-x64.app
        elif [ "$RUNNER_OS" == "Linux" ]; then
          cargo build --release --target x86_64-unknown-linux-gnu
          mv target/x86_64-unknown-linux-gnu/release/gupax .
          tar -cf linux.tar gupax 
          cargo build --release --target x86_64-pc-windows-gnu
          mv target/x86_64-pc-windows-gnu/release/gupax.exe .
          tar -cf windows.tar gupax.exe
        fi
      shell: bash

    - name: Archive (Windows)
      if: ${{ runner.os == 'Linux' }}
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: windows.tar

    - name: Archive
      if: ${{ runner.os == 'macOS' }}
      uses: actions/upload-artifact@v4
      with:
        name: macos
        path: macos.tar

    - name: Archive (Linux)
      if: ${{ runner.os == 'Linux' }}
      uses: actions/upload-artifact@v4
      with:
        name: linux
        path: linux.tar
